# Books: publish the app at once, then narrate every book in books.txt with Kokoro (5 voices) and republish.
name: Books

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-now:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p site && cp index.html site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        voice: [bm_george, am_michael, am_fenrir, af_heart, bf_emma]
        part: ["0-5", "6-11", "12-999"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet kokoro-onnx soundfile numpy lxml
      - name: Kokoro model
        run: |
          mkdir -p models
          curl -sL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la models
      - name: Narrate
        run: |
          mkdir -p epubs site
          while read -r slug url; do
            [ -z "$slug" ] && continue
            case "$slug" in \#*) continue;; esac
            curl -sL -A "Mozilla/5.0 (Macintosh) AppleWebKit/605.1.15 Safari/605.1.15" -o "epubs/$slug.epub" "$url"
            python -c "import zipfile,sys; zipfile.ZipFile('epubs/$slug.epub').testzip()" || { echo "Download of $slug is not an EPUB"; exit 1; }
            python render.py --epub "epubs/$slug.epub" --slug "$slug" --voice "${{ matrix.voice }}" --chapters "${{ matrix.part }}" --out site --models models
          done < books.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narration-${{ matrix.voice }}-${{ matrix.part }}
          path: site
          retention-days: 3
          if-no-files-found: ignore

  deploy:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: narration-*
          path: site
          merge-multiple: true
      - name: Assemble site
        run: |
          pip install --quiet lxml
          cp index.html site/
          python render.py --index --out site
          du -sh site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
